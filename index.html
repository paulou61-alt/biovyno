<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VYNO Calçados</title>
  <meta name="description" content="VYNO Calçados — compre nossos produtos no TikTok Shop e Shopee.">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#fff;display:flex;justify-content:center}
    main{width:min(100%,520px);padding:42px 22px 32px;text-align:center}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
    .mark{width:34px;height:34px;display:block}
    .mark path{fill:#ff6a00}
    h1{font-size:28px;letter-spacing:.08em;margin:0;font-weight:700}
    .tag{color:#aaa;font-size:14px;margin:8px 0 30px}
    .links{display:grid;gap:14px}
    a{display:flex;align-items:center;justify-content:center;min-height:58px;border:1px solid #2b2b2b;border-radius:14px;background:#111;color:#fff;text-decoration:none;font-weight:700;transition:.2s}
    a:hover{transform:translateY(-2px);border-color:#ff6a00}
    .tiktok{background:#ff6a00;border-color:#ff6a00;color:#050505}
    footer{margin-top:34px;color:#666;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100" aria-label="VYNO"><path d="M12 18h24l14 38 14-38h24L62 82H38z"/></svg>
      <h1>VYNO</h1>
    </div>
    <div class="tag">Calçados para acompanhar seu estilo.</div>
    <div class="links">
      <a class="tiktok" href="https://vt.tiktok.com/ZSbRPqR81/?page=TikTokShop" target="_blank" rel="noopener noreferrer">COMPRE NO TIKTOK SHOP</a>
      <a href="https://shopee.com.br/vynocalcados" target="_blank" rel="noopener noreferrer">COMPRE NA SHOPEE</a>
    </div>
    <footer>© VYNO Calçados</footer>
  </main>
</body>
</html>
